name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: >
          Also publish to PyPI. Requires the `pypi` environment and a
          configured Trusted Publisher. Off by default - see
          docs/architecture/adr/ADR-009-distribution.md
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify before releasing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7

      - name: Install
        run: uv sync --extra dev

      - name: Tests, lint, types
        run: |
          uv run pytest -m "not live"
          uv run ruff format --check src tests
          uv run ruff check src tests
          uv run mypy

      - name: Templates, examples, manifests
        run: |
          uv run python scripts/validate_examples.py
          uv run python scripts/validate_codex_plugin.py
          uv run python scripts/check_single_skills_tree.py
          uv run python scripts/check_gitignore.py

      - name: The tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          declared=$(uv run python -c "import meta_ads_agent; print(meta_ads_agent.__version__)")
          manifest=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          codex=$(python3 -c "import json;print(json.load(open('.codex-plugin/plugin.json'))['version'])")
          echo "tag=$tag package=$declared claude=$manifest codex=$codex"
          for value in "$declared" "$manifest" "$codex"; do
            if [ "$value" != "$tag" ]; then
              echo "error: version mismatch — tag $tag, found $value"
              exit 1
            fi
          done

      - name: The changelog has an entry for this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          grep -q "## \[$tag\]" CHANGELOG.md || {
            echo "error: CHANGELOG.md has no '## [$tag]' entry"
            exit 1
          }

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7

      - run: uv build

      - name: The wheel is self-sufficient
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/meta-ads-agent --version
          /tmp/clean/bin/meta-ads-agent capabilities --validate

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          # Extract this version's section from the changelog as release notes.
          awk -v v="$version" '
            $0 ~ "^## \\["v"\\]" {found=1; print; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > /tmp/notes.md
          prerelease=""
          case "$version" in
            0.*) prerelease="--prerelease" ;;
          esac
          gh release create "$tag" dist/* \
            --title "$tag" \
            --notes-file /tmp/notes.md \
            $prerelease

  pypi:
    name: Publish to PyPI
    needs: build
    # Never automatic. Requires an explicit manual run AND an environment
    # approval - see ADR-009.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing; no API token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
