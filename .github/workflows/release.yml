name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: >
          Also publish to PyPI. Requires the `pypi` environment and a
          configured Trusted Publisher. Off by default - see
          docs/architecture/adr/ADR-009-distribution.md
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify before releasing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install
        # The api extra, so the contract tests against the real SDK run here
        # too; without it they skip, and a release would ship unchecked.
        run: uv sync --extra dev --extra api

      - name: Tests, lint, types
        run: |
          uv run pytest -m "not live"
          uv run ruff format --check src tests scripts
          uv run ruff check src tests scripts
          uv run mypy

      - name: Templates, examples, manifests
        run: |
          uv run python scripts/validate_examples.py
          uv run python scripts/validate_codex_plugin.py
          uv run python scripts/check_single_skills_tree.py
          uv run python scripts/check_gitignore.py
          uv run python scripts/sync_skill_blocks.py --check
          uv run python scripts/check_skill_packaging.py
          uv run python scripts/build_mcp_tool_inventory.py --check

      - name: The packaged tree is the tree that was checked
        # A release whose manifest disagrees with the payload cannot tell a
        # complete installation from a partial one, which is the whole point
        # of having a manifest. Nothing ships past this.
        run: uv run python scripts/build_release_manifest.py --check

      - name: The tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          declared=$(uv run python -c "import meta_ads_agent; print(meta_ads_agent.__version__)")
          manifest=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          codex=$(python3 -c "import json;print(json.load(open('.codex-plugin/plugin.json'))['version'])")
          release=$(python3 -c "import json;print(json.load(open('release-manifest.json'))['version'])")
          echo "tag=$tag package=$declared claude=$manifest codex=$codex release-manifest=$release"
          for value in "$declared" "$manifest" "$codex" "$release"; do
            if [ "$value" != "$tag" ]; then
              echo "error: version mismatch — tag $tag, found $value"
              exit 1
            fi
          done

      - name: The changelog has an entry for this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          grep -q "## \[$tag\]" CHANGELOG.md || {
            echo "error: CHANGELOG.md has no '## [$tag]' entry"
            exit 1
          }

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - run: uv build

      - name: The wheel is self-sufficient
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/meta-ads-agent --version
          /tmp/clean/bin/meta-ads-agent capabilities --validate

      - name: Clean install, then upgrade over an older installation
        # The two things a release has to be able to do to somebody's
        # machine. The doctored older install carries a file this release no
        # longer ships; if it survives, the release does not go out.
        run: |
          set -euo pipefail
          mkdir -p /tmp/skills-clean
          /tmp/clean/bin/meta-ads-agent install \
            --target path --path /tmp/skills-clean --json > /tmp/install.json
          cp -r /tmp/skills-clean /tmp/skills-old
          printf '# left over\n' > /tmp/skills-old/meta-ads-core/references/stale.md
          python3 - <<'PY'
          import json, pathlib
          state = pathlib.Path("/tmp/skills-old/.meta-ads-agent-install.json")
          data = json.loads(state.read_text())
          data["version"] = "0.0.1"
          state.write_text(json.dumps(data))
          PY
          /tmp/clean/bin/meta-ads-agent upgrade \
            --target path --path /tmp/skills-old --json > /tmp/upgrade.json
          python3 - <<'PY'
          import json, pathlib
          fresh = json.load(open("/tmp/install.json"))
          assert fresh["action"] == "install" and fresh["verification"]["complete"]
          up = json.load(open("/tmp/upgrade.json"))
          assert up["action"] == "upgrade", up["action"]
          assert up["verification"]["complete"], up["verification"]
          assert not pathlib.Path(
              "/tmp/skills-old/meta-ads-core/references/stale.md"
          ).exists(), "a file this release dropped survived the upgrade"
          print("clean install and upgrade ok")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  github-release:
    name: GitHub release
    needs: build
    # A tag push only: a manual run on an existing tag (to publish to PyPI)
    # would otherwise try to create a release that already exists, and fail.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          # Extract this version's section from the changelog as release notes.
          awk -v v="$version" '
            $0 ~ "^## \\["v"\\]" {found=1; print; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > /tmp/notes.md
          if [ "$(wc -l < /tmp/notes.md)" -lt 2 ]; then
            echo "::error::no changelog section for $version to use as release notes"
            exit 1
          fi
          prerelease=""
          case "$version" in
            0.*) prerelease="--prerelease" ;;
          esac
          gh release create "$tag" dist/* \
            --title "$tag" \
            --notes-file /tmp/notes.md \
            $prerelease

  pypi:
    name: Publish to PyPI
    needs: build
    # Never automatic. Requires an explicit manual run AND an environment
    # approval - see ADR-009. The run must also be started on a v* tag: the
    # version and changelog checks in `verify` only run for tag refs, and a
    # PyPI version, once uploaded, can never be replaced.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing; no API token stored anywhere
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
