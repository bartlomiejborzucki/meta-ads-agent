name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because a secret can be committed to a branch that never opens a PR.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in a later commit is still in the
          # history, and still needs rotating.
          fetch-depth: 0

      - name: Install gitleaks
        # Pinned so a scanner upgrade cannot silently change CI's verdict.
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose

      - name: Scan the git history
        run: gitleaks git . --config .gitleaks.toml --redact --verbose

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No credential files are tracked
        run: |
          set -euo pipefail
          # .env.example is the only .env-shaped file that may be tracked.
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\..*)|\.pem$|\.key$|credentials\.json$|secrets\.ya?ml$' | grep -v '^\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "error: credential-shaped files are tracked:"
            echo "$tracked"
            exit 1
          fi
          echo "no credential files tracked"

      - name: No brand workspace is tracked
        run: |
          set -euo pipefail
          tracked=$(git ls-files | grep -E '(^|/)\.meta-ads/' || true)
          if [ -n "$tracked" ]; then
            echo "error: a private brand workspace is tracked:"
            echo "$tracked"
            echo "It holds account ids, performance data, and creative assets."
            exit 1
          fi
          echo "no workspace tracked"

      - name: .gitignore covers the things that must never be committed
        run: python3 scripts/check_gitignore.py
