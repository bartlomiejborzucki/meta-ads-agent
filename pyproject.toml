[project]
name = "meta-ads-agent"
version = "0.1.0"
description = "Agent-native toolkit for operating Meta Ads through Meta's official Ads MCP, with a narrow Marketing API fallback"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "meta-ads-agent contributors" }]
keywords = ["meta-ads", "facebook-ads", "instagram-ads", "mcp", "agent-skills", "advertising"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]

# Deliberately minimal. Validation and config parsing only. No HTTP client, no
# web framework, no database - see docs/architecture/overview.md.
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# The Marketing API fallback. Not installed by default: a user who only needs
# capabilities the official MCP covers never downloads this.
# Majors track Graph API versions, so the range is pinned to one major.
api = ["facebook-business>=26.0,<27"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[project.scripts]
meta-ads-agent = "meta_ads_agent.cli.main:main"

[project.urls]
Homepage = "https://github.com/OWNER/meta-ads-agent"
Documentation = "https://github.com/OWNER/meta-ads-agent/tree/main/docs"
Issues = "https://github.com/OWNER/meta-ads-agent/issues"
Changelog = "https://github.com/OWNER/meta-ads-agent/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meta_ads_agent"]

# Data files the CLI reads at runtime. Kept in the repo root for editability
# and copied into the wheel so an installed package is self-sufficient.
[tool.hatch.build.targets.wheel.force-include]
"config/capabilities.yaml" = "meta_ads_agent/_data/capabilities.yaml"
"templates" = "meta_ads_agent/_data/templates"

[tool.hatch.build.targets.sdist]
include = [
  "src/", "config/", "templates/", "skills/", "integrations/",
  "docs/", "examples/", "tests/",
  "README.md", "LICENSE", "CHANGELOG.md", "THIRD_PARTY_NOTICES.md",
  "upstreams.yaml", ".env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  # Live tests are excluded by default. They require META_ADS_LIVE_TESTS=1 and a
  # designated test ad account. They never run in CI. See tests/live/README.md.
  "live: talks to a real Meta account (opt-in, never in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "S"]
ignore = [
  "S101",    # assert is fine in tests, and ruff's per-file ignores cover src
  "RUF012",  # ClassVar annotations on pydantic models are noise
  # Exception names read better without an Error suffix here, and DryRun is
  # deliberately not an error - it signals a completed preview.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]  # fake tokens and temp paths in fixtures

[tool.mypy]
python_version = "3.11"
packages = ["meta_ads_agent"]
mypy_path = "src"
strict = true
warn_unreachable = true
# facebook-business ships no type information.
[[tool.mypy.overrides]]
module = ["facebook_business.*"]
ignore_missing_imports = true
