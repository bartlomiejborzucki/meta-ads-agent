# ---------------------------------------------------------------------------
# Upstream tracking
# ---------------------------------------------------------------------------
# Dependencies and reference projects worth watching, with the commit or
# release each was reviewed at.
#
# .github/workflows/upstream-check.yml checks these on a schedule and opens or
# updates an issue when a tracked HEAD or release moves. It never auto-merges:
# a plugin-format change or an SDK major is a migration, not a bump.
#
# Meta's official Ads MCP has no public repository and publishes no schemas, so
# it cannot be watched this way. Its refresh is a documented manual procedure -
# docs/reference/capability-refresh.md.
#
# integration_type:
#   dependency     installed at runtime from a package registry
#   format         a specification we must conform to
#   reference      read for ideas; nothing copied
#   restricted     cannot be copied from; license forbids it
# ---------------------------------------------------------------------------

version: 1
reviewed: 2026-09-16

upstreams:

  # -- Runtime dependency --------------------------------------------------
  - repo: facebook/facebook-python-business-sdk
    package: facebook-business
    purpose: >
      The official Meta Business SDK. Powers every API fallback call. Handles
      auth, pagination, retries, request formatting, and chunked video upload
      with processing polling - all of which we deliberately do not
      reimplement.
    license: Facebook Platform License (NOASSERTION on GitHub; not OSI-approved)
    reviewed_version: 26.0.1
    reviewed_release_date: 2026-08-25
    review_date: 2026-09-16
    integration_type: dependency
    vendored: false
    affected_areas:
      - src/meta_ads_agent/api/
      - src/meta_ads_agent/api/version.py
      - pyproject.toml
    watch: releases
    notes: >
      Majors track Graph API versions: 26.x corresponds to v26.0. An upgrade is
      an API migration, so Dependabot must not auto-merge it. Never vendor the
      source - the license permits use in connection with Meta's platform, not
      redistribution.

  # -- Host plugin formats -------------------------------------------------
  - repo: openai/plugins
    purpose: >
      Reference implementations of the Codex plugin format. Our
      .codex-plugin/plugin.json is validated structurally against the spec in
      .agents/skills/plugin-creator/references/plugin-json-spec.md.
    license: none declared at the repository root
    reviewed_sha: 1dc1958
    review_date: 2026-09-16
    integration_type: format
    affected_areas:
      - .codex-plugin/plugin.json
      - integrations/codex/
      - docs/getting-started/install-codex.md
    watch: head
    notes: >
      Read for the plugin.json specification and for how remote OAuth MCP
      servers are declared (the Linear and Airtable plugins were the useful
      examples). Field names are required by the format; no content was copied.
      The format moved more than once during 2026 - re-check before changing
      the manifest.

  - repo: anthropics/claude-code
    purpose: >
      Claude Code itself, and the plugin and marketplace schemas.
      `claude plugin validate` is our manifest check in CI.
    license: Apache-2.0 (documentation and examples)
    reviewed_version: 2.1.273
    review_date: 2026-09-16
    integration_type: format
    affected_areas:
      - .claude-plugin/plugin.json
      - .claude-plugin/marketplace.json
      - integrations/claude/
      - docs/getting-started/install-claude-code.md
    watch: releases
    notes: >
      The `skills` manifest field requires a "./"-prefixed path; "skills" and
      ["skills"] both fail validation. Found by testing against 2.1.273, not
      from documentation - worth re-testing after an upgrade.

  - repo: anthropics/claude-plugins-official
    purpose: Marketplace schema and plugin-entry conventions.
    license: Apache-2.0
    reviewed_sha: 76c85b7
    review_date: 2026-09-16
    integration_type: format
    affected_areas:
      - .claude-plugin/marketplace.json
    watch: head

