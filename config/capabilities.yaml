# ---------------------------------------------------------------------------
# Capability registry
# ---------------------------------------------------------------------------
# Which execution layer owns which capability, and what approval it needs.
#
# Routing rule (see docs/architecture/adr/ADR-002-api-fallback.md):
#   1. If the official MCP covers it, use the MCP.
#   2. Only if it does not, use the fallback.
#   3. Never use the fallback because it is more convenient.
#   4. When the fallback is used, say so and name the gap.
#
# The fallback is expected to SHRINK. When Meta adds a capability, add a test,
# flip preferred_provider, mark the fallback deprecated, then delete the code.
#
# providers:
#   official_mcp   Meta's server at https://mcp.facebook.com/ads
#   api_fallback   `meta-ads-agent api ...` via the facebook-business SDK
#   none           Not supported in this release
#
# risk_level maps to the approval classes in
# skills/meta-ads-core/references/safety-policy.md:
#   read · create_paused · update_inactive · update_active · budget_increase
#   · activate · delete · bulk · pii_upload
#
# Validate after editing:  meta-ads-agent capabilities --validate
# ---------------------------------------------------------------------------

version: 1
reviewed: 2026-11-04
graph_api_version: v26.0
mcp_endpoint: https://mcp.facebook.com/ads

# Tool names are recorded as hints for the agent, not as contracts. Meta can
# rename them. The core skill instructs the agent to introspect the connected
# server and to trust a platform validation error over anything written here.
notes: |
  Sourced from Meta's published Ads MCP tool reference on 2026-09-16, and
  refreshed on 2026-11-04 from the tool list and tool descriptions a connected
  session exposed (read, not called). A campaign built on 2026-11-03 confirmed
  the Instagram-post creative and media upload live. Every former fallback gap
  is covered by the MCP as of 2026-11-04 (ADR-012); the `api` commands stay as
  deprecated fallbacks for one release. On 2026-11-11 the tool NAMES were
  compared with a connected session again (`capabilities --compare`): one was
  gone, ads_update_custom_audience_users, and customer-list membership is no
  longer something the MCP does. Entries dated 2026-11-11 were checked by
  name only, except the audience entries, whose descriptions were read.
  Re-verify with
  docs/reference/capability-refresh.md before relying on any single tool name.

capabilities:

  # -- Discovery -----------------------------------------------------------
  - name: list_ad_accounts
    area: accounts
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_get_ad_accounts]
    risk_level: read
    requires_confirmation: false
    last_reviewed: 2026-11-11
    notes: >
      Returns currency and timezone. Read this before interpreting any budget
      number. Community-reported eligibility fields worth checking before a
      write: is_ads_mcp_enabled, is_queryable, has_payment_method.

  - name: list_pages
    area: pages
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_get_user_pages, ads_get_ad_account_pages, ads_get_pages_for_business]
    risk_level: read
    requires_confirmation: false
    last_reviewed: 2026-11-11
    notes: A Facebook Page is mandatory ad identity. Resolve it before planning.

  - name: list_instagram_accounts
    area: instagram
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_get_ig_accounts, ads_get_ig_media]
    risk_level: read
    requires_confirmation: false
    last_reviewed: 2026-11-11

  - name: field_metadata
    area: diagnostics
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_get_field_context]
    risk_level: read
    requires_confirmation: false
    last_reviewed: 2026-11-11
    notes: >
      The supported way to discover current enum values (objectives,
      optimization goals, CTA types) instead of hardcoding them. Prefer this
      over any remembered list.

  # -- Campaign structure --------------------------------------------------
  - name: read_campaign_structure
    area: campaigns
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_get_ad_entities]
    risk_level: read
    requires_confirmation: false
    last_reviewed: 2026-11-11

  - name: create_campaign
    area: campaigns
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_create_campaign]
    risk_level: create_paused
    requires_confirmation: false
    last_reviewed: 2026-11-04
    notes: >
      Created PAUSED, or staged as a draft where Meta has enabled draft mode
      for the account (status=DRAFT). Never override either. An optional
      campaign_spend_cap is in minor units; Meta rejected a PLN cap below
      500 PLN with error 2446307 (seen 2026-11-03).

  - name: create_ad_set
    area: ad_sets
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_create_ad_set]
    risk_level: create_paused
    requires_confirmation: false
    last_reviewed: 2026-11-11
    notes: >
      Budget lives here for ABO and on the campaign for CBO; never both.
      entity_type is spelled ad_set (community-reported).

  - name: create_ad
    area: ads
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_create_ad]
    risk_level: create_paused
    requires_confirmation: false
    last_reviewed: 2026-11-11

  - name: update_entity_inactive
    area: campaigns
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_update_entity]
    risk_level: update_inactive
    requires_confirmation: false
    last_reviewed: 2026-11-11
    notes: Editing a paused entity cannot move money today.

  - name: update_entity_active
    area: campaigns
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_update_entity]
    risk_level: update_active
    requires_confirmation: true
    last_reviewed: 2026-11-11
    notes: Same tool, different risk. Changing a live entity can shift delivery.

  - name: change_budget
    area: budgets
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_update_entity]
    risk_level: budget_increase
    requires_confirmation: true
    last_reviewed: 2026-11-11
    notes: >
      Always show current and proposed in account currency, read from Meta.
      Budgets are minor currency units (community-reported); use
      meta_ads_agent.money for every conversion.

  - name: activate_entity
    area: campaigns
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_activate_entity]
    risk_level: activate
    requires_confirmation: true
    last_reviewed: 2026-11-04
    notes: >
      Starts spending. Also publishes staged drafts: treat a publish exactly
      like an activation - only after preview and QA, with explicit approval,
      and only for the exact objects named in object_ids. The tool
      descriptions disagree on whether a published new campaign comes up
      ACTIVE or keeps its staged status (2026-11-04); assume it can spend.
      publish_as_active only when the user asked to turn it on.

  - name: pause_entity
    area: campaigns
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_update_entity]
    risk_level: update_active
    requires_confirmation: true
    last_reviewed: 2026-11-04
    notes: >
      Stops spending rather than starting it, so it is the safe direction. Still
      confirm the entity list first: pausing the wrong ad is a real loss. In
      draft mode a pause-only update of a published entity applies live
      (is_draft=false); never call ads_activate_entity after it.

  - name: delete_entity
    area: campaigns
    preferred_provider: official_mcp
    fallback_provider: api_fallback
    mcp_tools: [ads_update_entity]
    cli: meta-ads-agent api delete
    risk_level: delete
    requires_confirmation: true
    last_reviewed: 2026-11-04
    notes: >
      ads_update_entity with fields {"status":"DELETED"} deletes a campaign,
      ad set or ad (tool description, 2026-11-04; not yet run live here).
      Permanent. Discarding a never-published draft is ads_update_entity with
      discard_draft_changes, previewed first, then confirmed with a token.
      Prefer pausing: deleted objects lose optimisation history permanently.
      Requires a stated reason why pause is insufficient. The CLI command is
      a DEPRECATED fallback, kept for one release (ADR-012).

  - name: delete_creative
    area: creatives
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_creative_delete]
    risk_level: delete
    requires_confirmation: true
    last_reviewed: 2026-11-04
    notes: Only a creative no ad uses - check ads_get_creative_ads first.

  # -- Creatives and media -------------------------------------------------
  - name: create_single_image_creative
    area: creatives
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_create_creative]
    risk_level: create_paused
    requires_confirmation: false
    last_reviewed: 2026-11-04
    notes: >
      Flat parameters (page_id, image_hash or image_url, link_url, message,
      headline, call_to_action_type), as the tool description shows. Set
      instagram_user_id when the ad will deliver on Instagram.

  - name: local_image_upload
    area: images
    preferred_provider: official_mcp
    fallback_provider: api_fallback
    mcp_tools:
      - ads_creative_upload_media
      - ads_creative_upload_local_image
      - ads_finalize_local_ad_image_upload
    cli: meta-ads-agent api upload-image
    risk_level: create_paused
    requires_confirmation: false
    last_reviewed: 2026-11-04
    notes: >
      ads_creative_upload_media uploads from a public URL anywhere, and a
      local file through Meta's upload app in hosts with interactive MCP Apps
      (used live 2026-11-03). In a terminal host without MCP Apps, give it a
      public URL, or use the CLI - a DEPRECATED fallback kept for one release
      (ADR-012), deduplicated by SHA-256 through the asset manifest.

  - name: local_video_upload
    area: videos
    preferred_provider: official_mcp
    fallback_provider: api_fallback
    mcp_tools: [ads_creative_upload_media]
    cli: meta-ads-agent api upload-video
    risk_level: create_paused
    requires_confirmation: false
    last_reviewed: 2026-11-04
    notes: >
      Same tool and the same host limit as images. Meta transcodes
      asynchronously: a video is usable in a creative once ads_get_ad_videos
      reports it ready. The CLI is a DEPRECATED fallback (ADR-012).

  - name: create_video_creative
    area: creatives
    preferred_provider: official_mcp
    fallback_provider: api_fallback
    mcp_tools: [ads_create_creative]
    cli: meta-ads-agent api create-creative --video
    risk_level: create_paused
    requires_confirmation: false
    last_reviewed: 2026-11-04
    notes: >
      ads_create_creative with video_id plus one of image_hash or image_url as
      the thumbnail (tool description, 2026-11-04). A description on a video
      needs link_url. The CLI is a DEPRECATED fallback (ADR-012).

  - name: create_existing_post_creative
    area: creatives
    preferred_provider: official_mcp
    fallback_provider: api_fallback
    mcp_tools: [ads_create_ad, ads_create_creative]
    cli: meta-ads-agent api create-creative --post
    risk_level: create_paused
    requires_confirmation: false
    last_reviewed: 2026-11-04
    notes: >
      A Facebook Page post is object_story_id; an Instagram post is
      source_instagram_media_id with instagram_user_id. Live on 2026-11-03:
      a creative_id made by ads_create_creative from an Instagram post failed
      at ads_create_ad with ObjectStorySpecRedundant (1443051); passing the
      post inline in ads_create_ad's creative worked. A profile button needs
      call_to_action VIEW_INSTAGRAM_PROFILE with value.link set to the
      profile URL. The CLI is a DEPRECATED fallback (ADR-012).

  - name: boost_instagram_post
    area: creatives
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_boost_ig_post]
    risk_level: create_paused
    requires_confirmation: true
    last_reviewed: 2026-11-04
    notes: >
      Campaign, ad set and ad from one Instagram post in one call. The tool
      documents that everything is created PAUSED, and plans first with
      confirmed=false. Its defaults are not this project's: US targeting,
      roughly 5 USD a day for 6 days, OUTCOME_TRAFFIC. Show the plan, set
      every one of those from the user's plan, then confirm.

  - name: create_multi_variant_creative
    area: creatives
    preferred_provider: official_mcp
    fallback_provider: api_fallback
    mcp_tools: [ads_create_creative]
    cli: meta-ads-agent api create-creative --variants
    risk_level: create_paused
    requires_confirmation: false
    last_reviewed: 2026-11-04
    notes: >
      multi_media (2-10 images or videos, up to five primary texts,
      headlines and descriptions; Meta chooses at delivery) or
      placement_customizations (2-10 assets pinned to placements, exactly one
      fallback), per the tool description 2026-11-04. Then pass the
      creative_id to ads_create_ad. The CLI is a DEPRECATED fallback
      (ADR-012).

  - name: create_carousel_creative
    area: creatives
    preferred_provider: official_mcp
    fallback_provider: api_fallback
    mcp_tools: [ads_create_creative]
    cli: meta-ads-agent api create-creative --carousel
    risk_level: create_paused
    requires_confirmation: false
    last_reviewed: 2026-11-04
    notes: >
      ads_create_creative with cards (2-10, image or video, each with its own
      link, headline and description), per the tool description 2026-11-04.
      The CLI is a DEPRECATED fallback (ADR-012).

  - name: list_creatives
    area: creatives
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools:
      - ads_get_creatives
      - ads_get_creative_ads
      - ads_get_ad_images
      - ads_get_ad_videos
      - ads_get_async_result
    risk_level: read
    requires_confirmation: false
    last_reviewed: 2026-11-04
    notes: >
      ads_get_creatives returns effective_object_story_id and
      effective_instagram_media_id - read them after building a post ad.
      ads_get_ad_videos reports whether an uploaded video is ready.

  - name: update_creative_metadata
    area: creatives
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_creative_update]
    risk_level: update_inactive
    requires_confirmation: false
    last_reviewed: 2026-11-04
    notes: Name, labels, ACTIVE status. A creative's content is immutable.

  - name: generate_image_variants
    area: images
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_creative_create_image_variations, ads_creative_update_image_elements]
    risk_level: create_paused
    requires_confirmation: false
    last_reviewed: 2026-11-04
    notes: >
      Meta's generative edits and variations of an existing ad image. Each
      result is a new image on the account, attached to nothing. Never invent
      text, prices or claims for them; protect brand elements.

  - name: delete_uploaded_image
    area: images
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_delete_local_ad_image]
    risk_level: delete
    requires_confirmation: true
    last_reviewed: 2026-11-04
    notes: The upload app's own delete for an image it uploaded.

  # -- Preview -------------------------------------------------------------
  - name: ad_preview
    area: previews
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_get_ad_preview, ads_get_ad_preview_screenshot]
    risk_level: read
    requires_confirmation: false
    last_reviewed: 2026-11-04
    notes: >
      Covers our needs, so there is no preview fallback. Render the placements
      the campaign actually targets, not just Feed. ads_get_ad_preview_screenshot
      is documented as app-only: do not call it; open preview_url in a browser
      tool instead when one is available.

  # -- Insights and diagnosis ---------------------------------------------
  - name: insights
    area: insights
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools:
      - ads_get_ad_entities
      - ads_insights_performance_trend
      - ads_insights_anomaly_signal
      - ads_insights_auction_ranking_benchmarks
      - ads_insights_industry_benchmark
      - ads_insights_advertiser_context
      - ads_insights_performance_vs_peers
      - ads_get_opportunity_score
    risk_level: read
    requires_confirmation: false
    last_reviewed: 2026-11-04
    notes: >
      ads_get_opportunity_score scores the account. It is not the per-campaign
      score Ads Manager shows, which can differ (100 vs 53 on 2026-11-04).

  - name: activity_log
    area: diagnostics
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_account_get_activity_logs]
    risk_level: read
    requires_confirmation: false
    last_reviewed: 2026-11-11
    notes: >
      Distinguishes "performance drifted" from "someone edited the ad set on
      Tuesday". Use it in every regression investigation.

  - name: delivery_errors
    area: diagnostics
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_get_errors, ads_get_help_article]
    risk_level: read
    requires_confirmation: false
    last_reviewed: 2026-11-11

  # -- Signals -------------------------------------------------------------
  - name: dataset_health
    area: pixels
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools:
      - ads_get_datasets
      - ads_get_dataset_details
      - ads_get_dataset_stats
      - ads_get_dataset_quality
      - ads_get_customconversions
    risk_level: read
    requires_confirmation: false
    last_reviewed: 2026-11-11
    notes: >
      stats and quality are the difference between "a pixel exists" and
      "events are arriving". Never claim tracking works from existence alone.

  - name: read_pixel_rules
    area: pixels
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_pixel_event_read, ads_pixel_parameter_read]
    risk_level: read
    requires_confirmation: false
    last_reviewed: 2026-11-11

  - name: pixel_rules
    area: pixels
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools:
      - ads_pixel_event_create
      - ads_pixel_event_update
      - ads_pixel_parameter_create
      - ads_pixel_parameter_update
    risk_level: update_active
    requires_confirmation: true
    last_reviewed: 2026-11-11
    notes: Event rules are created inactive; updating a live rule changes what is counted.

  - name: delete_pixel_rules
    area: pixels
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_pixel_event_delete, ads_pixel_parameter_delete]
    risk_level: delete
    requires_confirmation: true
    last_reviewed: 2026-11-11
    notes: >
      Deleting a rule can break reporting and the optimisation that depends on
      its events - the same class as deleting an audience or a catalog object.

  # -- Audiences -----------------------------------------------------------
  - name: read_custom_audiences
    area: audiences
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools:
      - ads_get_ad_account_custom_audiences
      - ads_get_custom_audience
      - ads_get_custom_audience_adsets
    risk_level: read
    requires_confirmation: false
    last_reviewed: 2026-11-11

  - name: create_custom_audience
    area: audiences
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_create_custom_audience, ads_update_custom_audience]
    risk_level: update_active
    requires_confirmation: true
    last_reviewed: 2026-11-11
    notes: >
      A lookalike or website audience contains no PII. A customer-file audience
      does - see upload_customer_list. Creating an audience does not change
      delivery by itself; attaching it to a live ad set does, and is its own
      update_active step. The meta-ads-audiences skill covers source choice
      and sizing for lookalikes.

  - name: upload_customer_list
    area: audiences
    preferred_provider: none
    fallback_provider: none
    mcp_tools: []
    risk_level: pii_upload
    requires_confirmation: true
    last_reviewed: 2026-11-11
    notes: >
      Not available through Meta's MCP as of 2026-11-11: the tool that did it
      (ads_update_custom_audience_users, listed on 2026-11-04) is gone, and
      ads_update_custom_audience says "Ads MCP does not support membership
      changes; use Ads Manager". ads_create_custom_audience creates a customer
      list EMPTY; the user fills it in Ads Manager > Audiences. We add no
      fallback on purpose - customer data stays out of this project. If Meta
      brings the tool back it is pii_upload: explicit instruction, a lawful
      basis, hashed identifiers, nothing logged or written to state.

  - name: delete_custom_audience
    area: audiences
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_delete_custom_audience]
    risk_level: delete
    requires_confirmation: true
    last_reviewed: 2026-11-11
    notes: Check ads_get_custom_audience_adsets first - live ad sets may target it.

  # -- Catalogs, experiments, research ------------------------------------
  - name: read_catalogs
    area: catalogs
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools:
      - ads_catalog_event_source_get
      - ads_catalog_event_source_get_catalogs
      - ads_catalog_event_source_get_health
      - ads_catalog_event_source_get_recommendations
      - ads_catalog_get_businesses
      - ads_catalog_get_data_sources
      - ads_catalog_get_diagnostics
      - ads_catalog_get_dynamic_ads_health
      - ads_catalog_get_feed_rules
      - ads_catalog_get_product_feed_upload_sessions
      - ads_catalog_list_catalogs
      - ads_catalog_list_dpa_eligible_catalogs
      - ads_catalog_list_partner_integrations
      - ads_catalog_list_product_feeds
      - ads_catalog_list_product_sets
      - ads_catalog_list_products
    risk_level: read
    requires_confirmation: false
    last_reviewed: 2026-11-04
    notes: >
      Catalog, product, set, feed and event-source reads, including the
      diagnostics and dynamic-ads health that should come before any change.
      MCP-only by design - there is no catalog fallback (ADR-002).

  - name: change_catalog
    area: catalogs
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools:
      - ads_catalog_create
      - ads_catalog_create_feed_rule
      - ads_catalog_create_product_feed
      - ads_catalog_create_product_feed_upload_session
      - ads_catalog_create_product_set
      - ads_catalog_event_source_connect
      - ads_catalog_event_source_disconnect
      - ads_catalog_product_create
      - ads_catalog_update_catalog
      - ads_catalog_update_feed_rule
      - ads_catalog_update_product
      - ads_catalog_update_product_feed
      - ads_catalog_update_product_set
    risk_level: update_active
    requires_confirmation: true
    last_reviewed: 2026-11-04
    notes: >
      A product's price or availability, a product set's filter, a feed's
      schedule, or an event-source connection is read by every live catalog
      ad that uses it - the change reaches delivery without touching a
      campaign. Show which live ad sets use the set before changing it.

  - name: delete_catalog_objects
    area: catalogs
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools:
      - ads_catalog_delete_product
      - ads_catalog_product_feed_delete
      - ads_catalog_product_feed_delete_rule
      - ads_catalog_product_set_delete
    risk_level: delete
    requires_confirmation: true
    last_reviewed: 2026-11-11
    notes: >
      Deleting a product set or feed breaks every ad set that uses it.

  - name: create_dynamic_ad_creative
    area: catalogs
    preferred_provider: none
    fallback_provider: none
    mcp_tools: []
    risk_level: create_paused
    requires_confirmation: false
    last_reviewed: 2026-09-24
    notes: >
      NOT SUPPORTED. A catalog ad's creative is a template (template_data),
      which ads_create_creative is not documented to build, and ADR-002 keeps
      catalogs MCP-only. The meta-ads-catalog skill prepares the catalog and
      product sets; the catalog ad itself is built in Ads Manager for now.

  - name: read_experiments
    area: experiments
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools:
      - ads_experiment_list_tests
      - ads_experiment_check_eligibility
      - ads_experiment_abtest_get_test
      - ads_experiment_lift_get_test
    risk_level: read
    requires_confirmation: false
    last_reviewed: 2026-11-11
    notes: >
      Listing tests, checking eligibility and reading results change nothing.
      Check eligibility before proposing a test, not after the user agrees.

  - name: create_experiment
    area: experiments
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_experiment_abtest_create_test, ads_experiment_lift_create_test]
    risk_level: update_active
    requires_confirmation: true
    last_reviewed: 2026-11-11
    notes: >
      A test splits live delivery, so creating one affects spend and what the
      existing campaigns learn. Size it first (meta-ads-agent report power): a
      test that cannot detect the effect it is for should not be created.

  - name: update_experiment
    area: experiments
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_experiment_abtest_update_test]
    risk_level: update_active
    requires_confirmation: true
    last_reviewed: 2026-11-11
    notes: >
      Ending or changing a running test early invalidates what it measured.
      Say so, with the power it had reached, before doing it.

  - name: ad_library_research
    area: ad_library
    preferred_provider: official_mcp
    fallback_provider: none
    mcp_tools: [ads_library_search]
    risk_level: read
    requires_confirmation: false
    last_reviewed: 2026-11-11
    notes: Research only. Extract themes; never clone a competitor's creative.

  # -- Not supported -------------------------------------------------------
  - name: lead_forms
    area: lead_forms
    preferred_provider: none
    fallback_provider: none
    mcp_tools: []
    risk_level: create_paused
    requires_confirmation: false
    last_reviewed: 2026-09-16
    notes: >
      NOT SUPPORTED. No MCP tool. Lead-gen campaigns can still use an
      existing form id supplied by the user; we cannot create or read forms.

  - name: automated_rules
    area: automation
    preferred_provider: none
    fallback_provider: none
    mcp_tools: []
    risk_level: update_active
    requires_confirmation: true
    last_reviewed: 2026-09-16
    notes: >
      NOT SUPPORTED, and out of scope by choice. An autonomous spend optimiser
      contradicts the approval model. See ADR-004.

  - name: partnership_ads
    area: partnership_ads
    preferred_provider: none
    fallback_provider: none
    mcp_tools: []
    risk_level: create_paused
    requires_confirmation: false
    last_reviewed: 2026-11-04
    notes: >
      NOT SUPPORTED, and out of scope. Partnership and branded-content ads
      need a creator's permission on their own identity. As of 2026-11-04 the
      MCP builds them (facebook_partnership_ad, instagram_partnership_ad, a
      partner ads_boost_ig_post) and manages permissions
      (ads_fb_partner_permission_manager,
      ads_ig_partnership_permission_manager); these skills do not cover them
      yet. Build them in Ads Manager, or with the MCP directly.
